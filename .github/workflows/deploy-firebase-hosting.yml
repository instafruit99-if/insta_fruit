# Firebase Hosting — use when delivering to client (same production env as GitHub Pages).
# Requires GitHub secrets: BACKEND_API_URL, RAZORPAY_KEY_ID, FIREBASE_SERVICE_ACCOUNT

name: Deploy Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure production environment
        working-directory: frontend
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
        run: node scripts/write-production-env.js

      - name: Build for Firebase Hosting
        working-directory: frontend
        run: npx ng build --configuration production --base-href /

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "${RUNNER_TEMP}/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/firebase-sa.json"
          firebase deploy --only hosting --project instafruit99-13755 --non-interactive
